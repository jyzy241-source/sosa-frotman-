version: "3.9"

# Uso: docker compose up --build
# Levanta DB + Redis + API con hot-reload + frontend con hot-reload.
# Pensado para desarrollo local, NO para producción (ver docker-compose.prod.yml).

services:
  db:
    image: postgres:16-alpine
    container_name: sf_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sosafrotman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sosafrotman}
      POSTGRES_DB: ${POSTGRES_DB:-sosafrotman_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sosafrotman} -d ${POSTGRES_DB:-sosafrotman_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sf_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
      dockerfile: ../../docker/services/api/Dockerfile
      target: dev
    container_name: sf_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sosafrotman}:${POSTGRES_PASSWORD:-sosafrotman}@db:5432/${POSTGRES_DB:-sosafrotman_dev}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ../apps/web
      dockerfile: ../../docker/apps/web/Dockerfile
      target: dev
    container_name: sf_web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - ../packages:/packages
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
