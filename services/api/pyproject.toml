[project]
name = "sosa-frotman-api"
version = "0.1.0"
description = "Backend FastAPI para Sosa-Frotman Inversiones"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.111",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0",
  "sqlmodel>=0.0.21",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "pyotp>=2.9",
  "slowapi>=0.1.9",
  "redis>=5.0",
  "reportlab>=4.2",
  "httpx>=0.27",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
